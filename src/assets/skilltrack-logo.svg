<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="st_bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00236F" />
      <stop offset="50%" stop-color="#0A338E" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="st_green_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="st_amber_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="st_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Container Badge -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#st_bg_grad)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.35" filter="url(#st_glow)" />

  <!-- Subtle grid / geometric track line accents -->
  <path d="M16 76 Q 50 76 84 76" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="2 2" />
  <path d="M16 64 Q 50 64 84 64" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="2 2" />

  <!-- Trajectory Pillar 1: Training (Base) -->
  <rect x="22" y="52" width="10" height="26" rx="4" fill="#60A5FA" fill-opacity="0.9" />
  
  <!-- Trajectory Pillar 2: Assessment & Certification (Middle) -->
  <rect x="38" y="40" width="10" height="38" rx="4" fill="#93C5FD" fill-opacity="0.95" />

  <!-- Trajectory Pillar 3: Employment Placement (Apex) -->
  <rect x="54" y="28" width="10" height="50" rx="4" fill="url(#st_green_grad)" />

  <!-- Dynamic Upward Arc / Ascending Swoosh connecting Training to Career -->
  <path d="M22 60 C 34 50, 48 36, 74 22" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <path d="M22 60 C 34 50, 48 36, 74 22" fill="none" stroke="url(#st_amber_grad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Arrowhead at Outcome Peak -->
  <path d="M64 19 L77 21 L73 34 Z" fill="#FBBF24" />

  <!-- Milestone Success Star / Target Beacon -->
  <circle cx="76" cy="21" r="3.5" fill="#FFFFFF" />
  <circle cx="76" cy="21" r="1.8" fill="#D97706" />
</svg>
